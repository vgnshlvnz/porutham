name: GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build the web app for GitHub Pages
        env:
          VITE_API_BASE: https://vinmeen.rvigneshwaran1103.workers.dev
        run: npm run build:pages -w vinmeen-web
      - name: Publish to the gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: packages/web/dist-pages
          # Writes .nojekyll. The build also touches that file.
          enable_jekyll: false
